name: Daily Cinema Catalog Sync

on:
  schedule:
    # Option B: Twice daily sync
    # 07:00 AM IST (01:30 UTC) - Catches overnight schedule updates
    - cron: '30 1 * * *'
    # 02:30 PM IST (09:00 UTC) - Catches afternoon advance booking drops
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: daily-cinema-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: "Asia/Kolkata"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Cinema Movies to Cloudflare KV
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u sync_cinema_catalog.py
