name: BookMyShow 24/7 Movie Tracker

on:
  schedule:
    - cron: '0 4 * * *'  # Runs once every 24 hours (daily at 09:30 AM IST / 04:00 UTC)
  workflow_dispatch:

concurrency:
  group: movie-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: "Asia/Kolkata"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Tor proxy
        run: |
          sudo apt-get install -y -q tor
          sudo service tor start
          sleep 5
          echo "Tor proxy ready on socks5h://127.0.0.1:9050"

      - name: Check BookMyShow
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCKS_PROXY: "socks5h://127.0.0.1:9050"
        run: python monitor.py

      - name: Notify Telegram on New Show
        if: steps.check.outputs.new_shows_found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py
